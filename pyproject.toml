[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scamflow-ai"
version = "0.1.0"
description = "Backend foundation for ScamFlow AI — Before-You-Pay Safety Copilot."
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.16.5",
    "argon2-cffi==25.1.0",
    "fastapi==0.142.2",
    "psycopg[binary]==3.2.10",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pytest-asyncio==1.2.0",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
